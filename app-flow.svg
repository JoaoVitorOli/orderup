<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .body { font-size: 12.5px; fill: #334155; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12.5px; fill: #334155; }
    .label { font-size: 12px; fill: #475569; }
    .yes { font-size: 12px; font-weight: 700; fill: #15803d; }
    .no { font-size: 12px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12px; font-style: italic; fill: #64748b; }
    .tag { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .arrow { stroke: #475569; stroke-width: 1.6; fill: none; }
    .client { fill: #eff6ff; stroke: #3b82f6; }
    .kitchen { fill: #fff7ed; stroke: #ea580c; }
    .nest { fill: #fff1f3; stroke: #e0234e; }
    .pg { fill: #eef2ff; stroke: #4338ca; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; }
    .inner { fill: #ffffff; stroke: #f4a3b4; }
    .planned { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="1010" fill="#ffffff"/>

  <text x="30" y="36" class="title">orderup · request flow</text>

  <!-- Legend -->
  <rect x="900" y="24" width="22" height="14" rx="3" class="inner" stroke-width="1.5"/>
  <text x="930" y="36" class="label">implemented</text>
  <rect x="1030" y="24" width="22" height="14" rx="3" class="inner planned" stroke-width="1.5"/>
  <text x="1060" y="36" class="label">planned</text>

  <!-- ============ Architecture ============ -->

  <!-- Customer -->
  <rect x="30" y="80" width="160" height="120" rx="12" class="client planned" stroke-width="1.5"/>
  <text x="110" y="128" text-anchor="middle" class="h1">Customer</text>
  <text x="110" y="150" text-anchor="middle" class="sub">React · phone</text>
  <text x="110" y="167" text-anchor="middle" class="sub">menu + order status</text>

  <!-- Customer <-> NestJS -->
  <line x1="190" y1="125" x2="288" y2="125" class="arrow" marker-end="url(#arrow)"/>
  <text x="240" y="117" text-anchor="middle" class="label">HTTP</text>
  <line x1="290" y1="155" x2="192" y2="155" class="arrow" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="240" y="173" text-anchor="middle" class="label">live status</text>

  <!-- Kitchen -->
  <rect x="30" y="250" width="160" height="120" rx="12" class="kitchen planned" stroke-width="1.5"/>
  <text x="110" y="298" text-anchor="middle" class="h1">Kitchen</text>
  <text x="110" y="320" text-anchor="middle" class="sub">React screen</text>
  <text x="110" y="337" text-anchor="middle" class="sub">open orders</text>

  <!-- Kitchen <-> NestJS -->
  <line x1="190" y1="295" x2="288" y2="295" class="arrow" marker-end="url(#arrow)"/>
  <text x="240" y="287" text-anchor="middle" class="label">HTTP + key</text>
  <line x1="290" y1="325" x2="192" y2="325" class="arrow" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="240" y="343" text-anchor="middle" class="label">new orders</text>

  <!-- NestJS -->
  <rect x="290" y="60" width="480" height="360" rx="12" class="nest" stroke-width="1.5"/>
  <text x="530" y="90" text-anchor="middle" class="h1">NestJS API</text>
  <text x="530" y="110" text-anchor="middle" class="sub">Express adapter · MikroORM · Zod · Socket.IO</text>

  <rect x="315" y="122" width="430" height="42" rx="8" class="inner"/>
  <text x="330" y="139" class="h2">ZodValidationPipe</text>
  <text x="330" y="156" class="body">Validates body, params and query with Zod schemas · invalid → 400</text>

  <rect x="315" y="170" width="430" height="42" rx="8" class="inner"/>
  <text x="330" y="187" class="h2">MenuItemController</text>
  <text x="330" y="204" class="body">/menu: GET · POST · GET /:id · PATCH /:id · DELETE /:id</text>

  <rect x="315" y="218" width="430" height="42" rx="8" class="inner"/>
  <text x="330" y="235" class="h2">MenuItemService</text>
  <text x="330" y="252" class="body">Duplicate name → 409 · missing item → 404 · em.flush</text>

  <rect x="315" y="266" width="430" height="42" rx="8" class="inner planned"/>
  <text x="330" y="283" class="h2">KitchenKeyGuard</text>
  <text x="735" y="283" text-anchor="end" class="tag">PLANNED</text>
  <text x="330" y="300" class="body">Kitchen-only routes: checks the KITCHEN_API_KEY header</text>

  <rect x="315" y="314" width="430" height="42" rx="8" class="inner"/>
  <text x="330" y="331" class="h2">OrdersController · OrdersService</text>
  <text x="330" y="348" class="body">POST /orders · GET /orders?status= · GET /orders/:id · PATCH …/status</text>

  <rect x="315" y="362" width="430" height="42" rx="8" class="inner planned"/>
  <text x="330" y="379" class="h2">OrdersGateway</text>
  <text x="735" y="379" text-anchor="end" class="tag">PLANNED</text>
  <text x="330" y="396" class="body">Socket.IO rooms: order:{id} (customer) · kitchen</text>

  <!-- NestJS <-> PostgreSQL -->
  <line x1="770" y1="150" x2="868" y2="150" class="arrow" marker-end="url(#arrow)"/>
  <line x1="870" y1="176" x2="772" y2="176" class="arrow" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="820" y="142" text-anchor="middle" class="label">MikroORM</text>

  <!-- PostgreSQL -->
  <rect x="870" y="60" width="300" height="252" rx="12" class="pg" stroke-width="1.5"/>
  <text x="895" y="90" class="h1">PostgreSQL</text>
  <text x="1003" y="90" class="sub">source of truth</text>
  <text x="895" y="122" class="mono">menu_item</text>
  <text x="913" y="142" class="mono">id · name · price · quantity</text>
  <text x="895" y="166" class="mono">order</text>
  <text x="913" y="186" class="mono">id · code · customer_name</text>
  <text x="913" y="206" class="mono">status · total · idempotency_key</text>
  <text x="895" y="230" class="mono">order_item</text>
  <text x="913" y="250" class="mono">order_id · menu_item_id</text>
  <text x="913" y="270" class="mono">quantity · unit_price</text>
  <text x="895" y="296" class="note">prices in cents · menu via DatabaseSeeder</text>

  <!-- ============ Flow 1: place an order ============ -->
  <rect x="20" y="440" width="1160" height="195" rx="12" class="panel"/>
  <text x="40" y="470" class="h1">1 · Place an order — POST /orders</text>

  <!-- step 1 -->
  <rect x="40" y="490" width="196" height="125" rx="10" class="nest" stroke-width="1.2"/>
  <circle cx="62" cy="512" r="12" fill="#e0234e"/>
  <text x="62" y="516" text-anchor="middle" class="badge-text">1</text>
  <text x="82" y="517" class="h2">Validate body</text>
  <text x="54" y="548" class="body">ZodValidationPipe:</text>
  <text x="54" y="566" class="body">customerName, items,</text>
  <text x="54" y="584" class="body">idempotencyKey</text>
  <text x="54" y="607" class="body">Invalid → 400</text>

  <line x1="236" y1="552" x2="269" y2="552" class="arrow" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="271" y="490" width="196" height="125" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="293" cy="512" r="12" fill="#4338ca"/>
  <text x="293" y="516" text-anchor="middle" class="badge-text">2</text>
  <text x="313" y="517" class="h2">Idempotency check</text>
  <text x="285" y="548" class="body">Same idempotencyKey</text>
  <text x="285" y="566" class="body">already used?</text>
  <text x="285" y="590" class="body">→ return that order,</text>
  <text x="285" y="607" class="body">no duplicate is created</text>

  <line x1="467" y1="552" x2="500" y2="552" class="arrow" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="502" y="490" width="196" height="125" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="524" cy="512" r="12" fill="#4338ca"/>
  <text x="524" y="516" text-anchor="middle" class="badge-text">3</text>
  <text x="544" y="517" class="h2">Check stock</text>
  <text x="516" y="548" class="body">Missing item → 404</text>
  <text x="516" y="566" class="body">Not enough quantity → 409</text>
  <text x="516" y="590" class="mono">SELECT … FOR UPDATE</text>
  <text x="516" y="607" class="note">row lock · planned</text>

  <line x1="698" y1="552" x2="731" y2="552" class="arrow" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="733" y="490" width="196" height="125" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="755" cy="512" r="12" fill="#4338ca"/>
  <text x="755" y="516" text-anchor="middle" class="badge-text">4</text>
  <text x="775" y="517" class="h2">Save the order</text>
  <text x="747" y="548" class="mono">quantity -= qty</text>
  <text x="747" y="566" class="body">order: RECEIVED + code</text>
  <text x="747" y="590" class="body">items keep unit_price</text>
  <text x="747" y="607" class="body">all in one flush</text>

  <line x1="929" y1="552" x2="962" y2="552" class="arrow" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="964" y="490" width="196" height="125" rx="10" class="client" stroke-width="1.2"/>
  <circle cx="986" cy="512" r="12" fill="#3b82f6"/>
  <text x="986" y="516" text-anchor="middle" class="badge-text">5</text>
  <text x="1006" y="517" class="h2">Respond 201</text>
  <text x="978" y="548" class="mono">{ id, code,</text>
  <text x="992" y="566" class="mono">status, total }</text>
  <text x="978" y="590" class="mono">order:created</text>
  <text x="978" y="607" class="note">to kitchen · planned</text>

  <!-- ============ Flow 2: update status ============ -->
  <rect x="20" y="660" width="1160" height="330" rx="12" class="panel"/>
  <text x="40" y="690" class="h1">2 · Kitchen updates the status — PATCH /orders/:id/status</text>

  <!-- A: request -->
  <rect x="40" y="712" width="170" height="76" rx="10" class="kitchen" stroke-width="1.2"/>
  <text x="125" y="743" text-anchor="middle" class="h2">Request</text>
  <text x="125" y="765" text-anchor="middle" class="mono">{ status }</text>

  <line x1="210" y1="750" x2="258" y2="750" class="arrow" marker-end="url(#arrow)"/>

  <!-- B: key ok? -->
  <polygon points="310,712 360,750 310,788 260,750" class="nest planned" stroke-width="1.2"/>
  <text x="310" y="755" text-anchor="middle" class="h2">key ok?</text>

  <!-- B yes -> C -->
  <line x1="360" y1="750" x2="418" y2="750" class="arrow" marker-end="url(#arrow)"/>
  <text x="389" y="742" text-anchor="middle" class="yes">yes</text>

  <!-- B no -> 401 -->
  <line x1="310" y1="788" x2="310" y2="838" class="arrow" marker-end="url(#arrow)"/>
  <text x="320" y="818" class="no">no</text>
  <rect x="220" y="840" width="180" height="62" rx="10" class="nest planned" stroke-width="1.2"/>
  <text x="310" y="866" text-anchor="middle" class="h2">401 Unauthorized</text>
  <text x="310" y="886" text-anchor="middle" class="body">missing or wrong key</text>

  <!-- C: load order -->
  <rect x="420" y="712" width="180" height="76" rx="10" class="pg" stroke-width="1.2"/>
  <text x="510" y="743" text-anchor="middle" class="h2">Load order</text>
  <text x="510" y="765" text-anchor="middle" class="mono">getById(id)</text>
  <text x="510" y="781" text-anchor="middle" class="body">missing → 404</text>

  <line x1="600" y1="750" x2="638" y2="750" class="arrow" marker-end="url(#arrow)"/>

  <!-- D: valid transition? -->
  <polygon points="710,708 780,750 710,792 640,750" class="nest" stroke-width="1.2"/>
  <text x="710" y="746" text-anchor="middle" class="h2">valid</text>
  <text x="710" y="762" text-anchor="middle" class="h2">transition?</text>

  <!-- D yes -> E -->
  <line x1="780" y1="750" x2="828" y2="750" class="arrow" marker-end="url(#arrow)"/>
  <text x="804" y="742" text-anchor="middle" class="yes">yes</text>

  <!-- D no -> 409 -->
  <line x1="710" y1="792" x2="710" y2="838" class="arrow" marker-end="url(#arrow)"/>
  <text x="720" y="818" class="no">no</text>
  <rect x="620" y="840" width="180" height="62" rx="10" class="nest" stroke-width="1.2"/>
  <text x="710" y="866" text-anchor="middle" class="h2">409 Conflict</text>
  <text x="710" y="886" text-anchor="middle" class="body">e.g. RECEIVED → READY</text>
  <text x="710" y="920" text-anchor="middle" class="note">same status → 200, no change</text>

  <!-- E: save -->
  <rect x="830" y="712" width="150" height="76" rx="10" class="pg" stroke-width="1.2"/>
  <text x="905" y="743" text-anchor="middle" class="h2">Save status</text>
  <text x="905" y="765" text-anchor="middle" class="mono">em.flush()</text>

  <line x1="980" y1="750" x2="1003" y2="750" class="arrow" marker-end="url(#arrow)"/>

  <!-- F: emit -->
  <rect x="1005" y="712" width="155" height="76" rx="10" class="nest planned" stroke-width="1.2"/>
  <text x="1082" y="736" text-anchor="middle" class="h2">Emit to rooms</text>
  <text x="1082" y="756" text-anchor="middle" class="mono">order:{id}</text>
  <text x="1082" y="774" text-anchor="middle" class="mono">kitchen</text>

  <!-- F -> G -->
  <line x1="1082" y1="788" x2="1082" y2="838" class="arrow" marker-end="url(#arrow)"/>

  <!-- G: live update -->
  <rect x="1000" y="840" width="164" height="62" rx="10" class="client planned" stroke-width="1.2"/>
  <text x="1082" y="866" text-anchor="middle" class="h2">Screens update live</text>
  <text x="1082" y="886" text-anchor="middle" class="body">no page refresh</text>

  <!-- Status lifecycle -->
  <text x="40" y="953" class="h2">Status lifecycle</text>
  <rect x="180" y="932" width="110" height="32" rx="16" class="client" stroke-width="1.2"/>
  <text x="235" y="953" text-anchor="middle" class="mono">RECEIVED</text>
  <line x1="290" y1="948" x2="318" y2="948" class="arrow" marker-end="url(#arrow)"/>
  <rect x="320" y="932" width="110" height="32" rx="16" class="kitchen" stroke-width="1.2"/>
  <text x="375" y="953" text-anchor="middle" class="mono">PREPARING</text>
  <line x1="430" y1="948" x2="458" y2="948" class="arrow" marker-end="url(#arrow)"/>
  <rect x="460" y="932" width="100" height="32" rx="16" class="pg" stroke-width="1.2"/>
  <text x="510" y="953" text-anchor="middle" class="mono">READY</text>

  <text x="590" y="953" class="note">Enum + DB check constraint · default RECEIVED</text>
</svg>
