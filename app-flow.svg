<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 720" width="1030" height="720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .body { font-size: 12.5px; fill: #334155; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12.5px; fill: #334155; }
    .label { font-size: 12px; fill: #475569; }
    .yes { font-size: 12px; font-weight: 700; fill: #15803d; }
    .no { font-size: 12px; font-weight: 700; fill: #b91c1c; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .arrow { stroke: #475569; stroke-width: 1.6; fill: none; }
    .client { fill: #eff6ff; stroke: #3b82f6; }
    .kitchen { fill: #fff7ed; stroke: #ea580c; }
    .nest { fill: #fff1f3; stroke: #e0234e; }
    .pg { fill: #eef2ff; stroke: #4338ca; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; }
    .inner { fill: #ffffff; stroke: #f4a3b4; }
    .planned { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1030" height="720" fill="#ffffff"/>

  <text x="30" y="36" class="title">orderup · flow</text>

  <!-- Legend -->
  <line x1="770" y1="31" x2="800" y2="31" class="arrow"/>
  <text x="808" y="35" class="label">implemented</text>
  <line x1="900" y1="31" x2="930" y2="31" class="arrow planned"/>
  <text x="938" y="35" class="label">planned</text>

  <!-- ============ Architecture ============ -->

  <rect x="30" y="80" width="160" height="80" rx="12" class="client" stroke-width="1.5"/>
  <text x="110" y="116" text-anchor="middle" class="h1">Customer</text>
  <text x="110" y="138" text-anchor="middle" class="sub">phone</text>

  <line x1="190" y1="105" x2="288" y2="105" class="arrow" marker-end="url(#arrow)"/>
  <text x="240" y="97" text-anchor="middle" class="label">HTTP</text>
  <line x1="288" y1="135" x2="192" y2="135" class="arrow planned" marker-end="url(#arrow)"/>
  <text x="240" y="153" text-anchor="middle" class="label">live status</text>

  <rect x="30" y="200" width="160" height="80" rx="12" class="kitchen" stroke-width="1.5"/>
  <text x="110" y="236" text-anchor="middle" class="h1">Kitchen</text>
  <text x="110" y="258" text-anchor="middle" class="sub">tablet</text>

  <line x1="190" y1="225" x2="288" y2="225" class="arrow" marker-end="url(#arrow)"/>
  <text x="240" y="217" text-anchor="middle" class="label">HTTP + key</text>
  <line x1="288" y1="255" x2="192" y2="255" class="arrow" marker-end="url(#arrow)"/>
  <text x="240" y="273" text-anchor="middle" class="label">live orders</text>

  <rect x="290" y="64" width="420" height="232" rx="12" class="nest" stroke-width="1.5"/>
  <text x="500" y="94" text-anchor="middle" class="h1">NestJS API</text>

  <rect x="310" y="110" width="380" height="36" rx="8" class="inner"/>
  <text x="326" y="133" class="h2">ZodValidationPipe</text>
  <rect x="310" y="154" width="380" height="36" rx="8" class="inner"/>
  <text x="326" y="177" class="h2">KitchenKeyGuard</text>
  <rect x="310" y="198" width="380" height="36" rx="8" class="inner"/>
  <text x="326" y="221" class="h2">Menu · Orders</text>
  <rect x="310" y="242" width="380" height="36" rx="8" class="inner"/>
  <text x="326" y="265" class="h2">RealtimeGateway</text>
  <text x="674" y="265" text-anchor="end" class="label">Socket.IO</text>

  <line x1="712" y1="180" x2="788" y2="180" class="arrow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="750" y="172" text-anchor="middle" class="label">MikroORM</text>

  <rect x="790" y="64" width="210" height="232" rx="12" class="pg" stroke-width="1.5"/>
  <text x="895" y="94" text-anchor="middle" class="h1">PostgreSQL</text>
  <text x="815" y="140" class="mono">menu_item</text>
  <text x="815" y="175" class="mono">order</text>
  <text x="815" y="210" class="mono">order_item</text>
  <text x="815" y="270" class="label">prices in cents</text>

  <!-- ============ Flow 1: place an order ============ -->
  <rect x="20" y="320" width="990" height="150" rx="12" class="panel"/>
  <text x="40" y="350" class="h1">1 · Place an order</text>
  <text x="215" y="350" class="mono">POST /orders</text>

  <rect x="40" y="370" width="170" height="80" rx="10" class="nest" stroke-width="1.2"/>
  <circle cx="60" cy="390" r="11" fill="#e0234e"/>
  <text x="60" y="394" text-anchor="middle" class="badge-text">1</text>
  <text x="80" y="395" class="h2">Validate</text>
  <text x="54" y="430" class="body">invalid → 400</text>

  <line x1="210" y1="410" x2="233" y2="410" class="arrow" marker-end="url(#arrow)"/>

  <rect x="235" y="370" width="170" height="80" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="255" cy="390" r="11" fill="#4338ca"/>
  <text x="255" y="394" text-anchor="middle" class="badge-text">2</text>
  <text x="275" y="395" class="h2">Idempotency</text>
  <text x="249" y="430" class="body">same key → same order</text>

  <line x1="405" y1="410" x2="428" y2="410" class="arrow" marker-end="url(#arrow)"/>

  <rect x="430" y="370" width="170" height="80" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="450" cy="390" r="11" fill="#4338ca"/>
  <text x="450" y="394" text-anchor="middle" class="badge-text">3</text>
  <text x="470" y="395" class="h2">Stock</text>
  <text x="444" y="430" class="body">missing 404 · low 409</text>

  <line x1="600" y1="410" x2="623" y2="410" class="arrow" marker-end="url(#arrow)"/>

  <rect x="625" y="370" width="170" height="80" rx="10" class="pg" stroke-width="1.2"/>
  <circle cx="645" cy="390" r="11" fill="#4338ca"/>
  <text x="645" y="394" text-anchor="middle" class="badge-text">4</text>
  <text x="665" y="395" class="h2">Save</text>
  <text x="639" y="430" class="body">one flush</text>

  <line x1="795" y1="410" x2="818" y2="410" class="arrow" marker-end="url(#arrow)"/>

  <rect x="820" y="370" width="170" height="80" rx="10" class="kitchen" stroke-width="1.2"/>
  <circle cx="840" cy="390" r="11" fill="#ea580c"/>
  <text x="840" y="394" text-anchor="middle" class="badge-text">5</text>
  <text x="860" y="395" class="h2">Notify</text>
  <text x="834" y="430" class="mono">order:created</text>

  <!-- ============ Flow 2: kitchen moves an order ============ -->
  <rect x="20" y="490" width="990" height="210" rx="12" class="panel"/>
  <text x="40" y="520" class="h1">2 · Kitchen moves an order</text>
  <text x="290" y="520" class="mono">PATCH /orders/:id/status</text>

  <rect x="40" y="550" width="150" height="60" rx="10" class="kitchen" stroke-width="1.2"/>
  <text x="115" y="576" text-anchor="middle" class="h2">Kitchen</text>
  <text x="115" y="596" text-anchor="middle" class="mono">{ status }</text>

  <line x1="190" y1="580" x2="238" y2="580" class="arrow" marker-end="url(#arrow)"/>

  <polygon points="290,545 340,580 290,615 240,580" class="nest" stroke-width="1.2"/>
  <text x="290" y="585" text-anchor="middle" class="h2">key?</text>

  <line x1="290" y1="615" x2="290" y2="648" class="arrow" marker-end="url(#arrow)"/>
  <text x="300" y="636" class="no">no</text>
  <rect x="230" y="650" width="120" height="36" rx="8" class="nest" stroke-width="1.2"/>
  <text x="290" y="673" text-anchor="middle" class="h2">401</text>

  <line x1="340" y1="580" x2="418" y2="580" class="arrow" marker-end="url(#arrow)"/>
  <text x="379" y="572" text-anchor="middle" class="yes">yes</text>

  <polygon points="470,545 520,580 470,615 420,580" class="nest" stroke-width="1.2"/>
  <text x="470" y="585" text-anchor="middle" class="h2">valid?</text>

  <line x1="470" y1="615" x2="470" y2="648" class="arrow" marker-end="url(#arrow)"/>
  <text x="480" y="636" class="no">no</text>
  <rect x="410" y="650" width="120" height="36" rx="8" class="nest" stroke-width="1.2"/>
  <text x="470" y="673" text-anchor="middle" class="h2">409</text>

  <line x1="520" y1="580" x2="578" y2="580" class="arrow" marker-end="url(#arrow)"/>
  <text x="549" y="572" text-anchor="middle" class="yes">yes</text>

  <rect x="580" y="550" width="150" height="60" rx="10" class="pg" stroke-width="1.2"/>
  <text x="655" y="576" text-anchor="middle" class="h2">Save</text>
  <text x="655" y="596" text-anchor="middle" class="mono">em.flush()</text>

  <line x1="730" y1="580" x2="778" y2="580" class="arrow" marker-end="url(#arrow)"/>

  <rect x="780" y="550" width="210" height="60" rx="10" class="kitchen" stroke-width="1.2"/>
  <text x="885" y="576" text-anchor="middle" class="h2">Notify</text>
  <text x="885" y="596" text-anchor="middle" class="mono">order:status_updated</text>

  <!-- Status lifecycle -->
  <rect x="600" y="652" width="100" height="32" rx="16" class="client" stroke-width="1.2"/>
  <text x="650" y="673" text-anchor="middle" class="mono">RECEIVED</text>
  <line x1="700" y1="668" x2="726" y2="668" class="arrow" marker-end="url(#arrow)"/>
  <rect x="728" y="652" width="110" height="32" rx="16" class="kitchen" stroke-width="1.2"/>
  <text x="783" y="673" text-anchor="middle" class="mono">PREPARING</text>
  <line x1="838" y1="668" x2="864" y2="668" class="arrow" marker-end="url(#arrow)"/>
  <rect x="866" y="652" width="90" height="32" rx="16" class="pg" stroke-width="1.2"/>
  <text x="911" y="673" text-anchor="middle" class="mono">READY</text>
</svg>
